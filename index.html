<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Anchor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Anchor</h1>
      <p class="subtitle">Take a breath</p>
    </header>

    <section class="quote-card">
      <p id="quote-text">Loading...</p>
      <p id="quote-source"></p>
    </section>

    <div class="actions">
      <button id="clip-btn" class="btn primary">Watch a Clip</button>
      <button id="new-quote-btn" class="btn secondary">New Quote</button>
    </div>

    <section class="personal">
      <h2>Your notes</h2>
      <textarea id="personal-note" placeholder="Write something calming for yourself..."></textarea>
      <button id="save-note-btn" class="btn secondary">Save Note</button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
