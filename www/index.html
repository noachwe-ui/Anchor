<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anchor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Main App Shell -->
  <div id="app"></div>

  <!-- In-App Video Modal Overlay -->
  <div id="video-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:9999; flex-direction:column; align-items:center; justify-content:center;">
    <button onclick="closeVideoModal()" style="position:absolute; top:20px; right:20px; color:#fff; background:#e53935; border:none; padding:10px 16px; border-radius:8px; font-weight:bold; font-size:16px; cursor:pointer;">✕ Close</button>
    <div style="width:90%; max-width:600px; text-align:center;">
      <h4 id="video-title" style="color:#fff; margin-bottom:12px;">Playing Media</h4>
      <video id="app-player" controls playsinline style="width:100%; border-radius:12px; background:#000;"></video>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
