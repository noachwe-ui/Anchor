<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Anchor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Anchor</h1>
      <p class="subtitle">Take a deep breath and give yourself credit. You're doing great! ✨</p>
    </header>

    <section class="quote-card">
      <p id="quote-text">Loading...</p>
      <p id="quote-source"></p>
    </section>

    <div class="actions">
      <button id="clip-btn" class="btn primary">Watch a Clip</button>
      <button id="new-quote-btn" class="btn secondary">Inspire Me ✨</button>
      <button id="chizuk-btn" class="btn secondary" style="display:none;">My Chizuk</button>
    </div>

    <section class="personal">
      <h2>Your notes</h2>
      <textarea id="personal-note" placeholder="What made you smile today?..."></textarea>
      <button id="save-note-btn" class="btn secondary">Keep This Thought 💛</button>
    </section>

    <section class="settings">
      <h2>Settings</h2>

      <h3 class="settings-label">Floating Bubble</h3>
      <div class="mode-list">
        <label class="mode-option">
          <input type="radio" name="bubble-mode" value="off">
          <span>Off</span>
        </label>
        <label class="mode-option">
          <input type="radio" name="bubble-mode" value="always">
          <span>Always on</span>
        </label>
        <label class="mode-option">
          <input type="radio" name="bubble-mode" value="targets">
          <span>Browsers & social apps</span>
        </label>
        <label class="mode-option">
          <input type="radio" name="bubble-mode" value="accessibility">
          <span>Accessibility detection</span>
        </label>
      </div>
      <button id="save-mode-btn" class="btn primary">Save Bubble Mode</button>
      <p id="mode-status" class="hint"></p>

      <h3 class="settings-label">My Chizuk Links</h3>
      <input id="chizuk-link" type="url" placeholder="https://..." />
      <button id="add-chizuk-btn" class="btn secondary">Add Link</button>
      <div id="chizuk-list"></div>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
