<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anchor</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #121212;
      color: #ffffff;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      max-width: 500px;
      margin: 16px auto;
    }
    .feed-btn {
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #333;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .feed-btn:active {
      background: #1e88e5;
    }
    #video-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #fff;
      background: #e53935;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div style="text-align:center; max-width:600px; margin:0 auto;">
    <h2>Anchor Feeds</h2>
    
    <div class="btn-grid">
      <button class="feed-btn" onclick="loadSpeakerFeed('rdavidashear.json')">R' David Ashear</button>
      <button class="feed-btn" onclick="loadSpeakerFeed('rjoeyhaber.json')">R' Joey Haber</button>
      <button class="feed-btn" onclick="loadSpeakerFeed('ryehudamandel.json')">R' Yehuda Mandel</button>
    </div>

    <div id="feed-container" style="margin-top:20px;"></div>
  </div>

  <!-- In-App Modal Player -->
  <div id="video-modal">
    <button class="close-btn" onclick="closeVideoModal()">✕ Close</button>
    <div style="width: 90%; max-width: 600px; text-align: center;">
      <h4 id="video-title" style="color: #fff; margin-bottom: 12px;">Playing Media</h4>
      <video id="app-player" controls playsinline style="width: 100%; border-radius: 12px; background: #000;"></video>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
